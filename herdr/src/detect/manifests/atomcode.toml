id = "atomcode"
version = "2026.11.09.2"
min_engine_version = 3
updated_at = "2026-11-09T00:00:00Z"

# A question is drawn as numbered options, then a "Type something." row and the
# "Chat about this" escape hatch. The numbers shift with the option count and
# their separator has changed between releases, so both are matched loosely.
#
# Only the bottom of the screen counts: an answered question keeps its frame in
# the scrollback, and the done row at the bottom proves the frame is history.
[[rules]]
id = "drawn_choice"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(8)"
visible_blocker = true
all = [
  { regex = ['(?m)^\s*(?:\d+[.)]|\[\d+\])\s*Type something\.?\s*$'] },
  { contains = ["Chat about this"] },
]
not = [{ contains = ["✻ Done"] }]

# The live status row carries a spinner, the tool count and the elapsed time.
# A finished turn replaces it with a "✻ Done" row.
[[rules]]
id = "status_running"
state = "working"
priority = 800
region = "whole_recent"
visible_working = true
regex = ['(?m)^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] running(?: \d+ tools?)? ']
