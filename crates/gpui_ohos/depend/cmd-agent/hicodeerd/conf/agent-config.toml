# Agent server settings for the build that runs inside HiCodeer.
#
# The editor's Agent panel is the visible front end for spaces and agents, so
# The server's own sidebar starts collapsed into nothing: no rail, no arrow.
# The TUI keeps everything else (panes, tabs, keybindings) unchanged.

# Fixed theme: this build does not expose a theme choice, and the default
# `catppuccin` was never picked for HiCodeer. `auto_switch` stays off (its own
# default), so the host appearance cannot override this.
[theme]
name = "dracula"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
# HiCodeer draws the tab switcher in its Agent panel, the right-click menu with
# its own ContextMenu, and the pane scrollbar with its own scrollbar style, so
# the TUI client stops drawing all three. The menu contents still come from the
# server over `pane.context_menu`.
show_tab_bar = false
context_menu_owner = "host"
pane_scrollbars = false
hide_tab_bar_when_single_tab = false
# Leave the terminal title alone. Any format here is picked up by the server as
# the pane's title and drawn on its top border, which costs a row and only
# repeats the space name the editor's Agent panel already shows.
window_title = ""
# Never switch to the narrow-screen layout. It reserves the top one or two rows
# for a header that names the space, which is the same information the Agent
# panel already shows, and the editor never hands this terminal a phone-sized
# surface. 0 disables the threshold entirely.
mobile_width_threshold = 0
