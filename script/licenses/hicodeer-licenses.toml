# Licenses allowed in Zed's dependencies. AGPL should not be added to this list.
# When adding to this list, please check the following open source license policies:
#
# * https://opensource.google/documentation/reference/thirdparty/licenses
accepted = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    "NCSA",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    # NOT an OSI license. The franken stack pulled in by
    # `franken-agent-detection` (herdr) ships MIT plus a rider denying use to
    # OpenAI, Anthropic and their affiliates. It is listed here because it is
    # accepted for this product, and kept visible as its own SPDX reference so
    # the report prints the rider instead of claiming plain MIT. See the
    # clarify block at the end of this file for the full text.
    "LicenseRef-MIT-OpenAI-Anthropic-Rider",
]

