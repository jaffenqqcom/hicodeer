[package]
name = "livekit_client"
version = "0.1.0"
edition.workspace = true
description = "Logic for using LiveKit with GPUI"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[example]]
name = "test_app"

[features]
test-support = ["collections/test-support", "gpui/test-support", "livekit_api/test-support", "dep:nanoid", "dep:postage"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
audio.workspace = true
collections.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
http_client_tls.workspace = true
image.workspace = true
livekit_api.workspace = true
log.workspace = true
nanoid = { workspace = true, optional = true }
parking_lot.workspace = true
postage = { workspace = true, optional = true, features = ["futures-traits", "logging", "blocking"] }
serde.workspace = true
serde_urlencoded.workspace = true
settings.workspace = true
smallvec.workspace = true
ui.workspace = true
util.workspace = true

# ===== [OHOS PORT BEGIN] no WebRTC/LiveKit stack on OHOS =====
# OHOS has no build of the native libwebrtc (webrtc-sys) and no ALSA/CoreAudio
# backend for `cpal`; the OHOS build uses `mock_client` (see the cfg selection in
# `src/lib.rs`) and therefore needs none of these. Every other target keeps the
# behaviour it had before.
[target.'cfg(not(any(target_env = "ohos", all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies]
libwebrtc.workspace = true
livekit.workspace = true
# ===== [OHOS PORT END] =====

[target.'cfg(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd"))'.dependencies]
livekit_api.workspace = true
nanoid.workspace = true
postage = { workspace = true, features = ["futures-traits", "logging", "blocking"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
tokio = { workspace = true, features = ["time"] }
webrtc-sys.workspace = true

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd", target_os = "windows"), not(target_env = "ohos")))'.dependencies]
scap.workspace = true

# OHOS has no X11/Wayland, screen-capture or ALSA stack: these features and
# dependencies would drag in `scap` (and through it the `x11` crate) and `cpal`,
# neither of which builds on OHOS. Every other target keeps the unconditional
# behaviour they had before.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
gpui = { workspace = true, features = ["screen-capture", "x11", "wayland"] }
cpal.workspace = true
rodio.workspace = true

# ===== [OHOS PORT] `mock_client` re-exports `test::Room` and friends, so the
# `test` module must compile on OHOS; it needs the channel and id helpers that
# upstream only wires up for Windows and FreeBSD.
[target.'cfg(target_env = "ohos")'.dependencies]
nanoid.workspace = true
postage = { workspace = true, features = ["futures-traits", "logging", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-video.workspace = true
objc2-core-foundation.workspace = true
coreaudio-rs = { workspace = true, features = ["core_audio"] }

[dev-dependencies]
collections = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
livekit_api = { workspace = true, features = ["test-support"] }
nanoid.workspace = true
postage = { workspace = true, features = ["futures-traits", "logging"] }
simplelog.workspace = true

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[package.metadata.cargo-shear]
ignored = ["serde_json"]
