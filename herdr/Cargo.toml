[package]
name = "hicodeer-agent"
version = "0.9.5"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/sounds/*",
    "docs/next/api/herdr-api.schema.json",
    "skills/herdr/SKILL.md",
    "distribution/install.ps1",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[lib]
name = "hicodeer_agent"
path = "src/lib.rs"

[[bin]]
name = "hicodeer-agent"
path = "src/main.rs"

[workspace]
members = ["crates/ghostty-vt"]
default-members = [".", "crates/ghostty-vt"]

[dependencies]
ghostty-vt = { path = "crates/ghostty-vt" }
anyhow = "1"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }
clap_complete = "4.5"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
interprocess = "2.4.2"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "0.2"
portable-pty = "=0.9.0"
png = "0.17"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
# Local coding-agent session history. CodeBuddy has no connector upstream, so
# it is our own scanner in src/sessions. Locked rev; upgrade requires
# re-verifying the OHOS build (FAD wants nightly, connectors build on 1.97.1).
# The registry in src/sessions/fad.rs constructs its ten connectors by name, so
# only the backends those ten read are worth compiling. `all-connectors` also
# pulls ChatGPT's AES-GCM, Shelley's fts5 index and the Cursor/Goose/Crush/
# Devin/Copilot VS Code database readers, none of which this build can reach.
# Keep this list in sync with fad_stores().
franken-agent-detection = { git = "https://github.com/Dicklesworthstone/franken_agent_detection", rev = "7fbfe9b52397f36cbbb2707559c314c3e09e200c", default-features = false, features = ["connectors", "codex-zstd", "hermes", "opencode", "openclaw-sqlite", "pi-durable", "pi-sqlite"] }
sha2 = "0.10"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
toml = "0.8"
# Codewhale keeps its hooks in the user's config.toml, which is full of
# commented defaults. Editing it as a value tree would drop those comments, so
# the integration edits the document in place.
toml_edit = "0.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1.13.1"
# DeepSeek Harness stores its transcripts as concatenated zstd frames by
# default; the header line has to be decompressed before it can be read.
zstd = "0.13"
schemars = { version = "1.2.1", features = ["derive"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
# ===== [OHOS PORT BEGIN] =====
# `fsqlite` (reached through FAD's SQLite-backed history connectors) builds an
# io_uring ring on Linux. On OpenHarmony `io_uring_register` (syscall 427) is
# not in the app seccomp allow-list and terminates the process with SIGSYS
# instead of failing the call, so the patched VFS skips the ring there and every
# file falls back to the blocking Unix implementation. `herdr` is its own
# workspace, so this patch lives here rather than in the root manifest.
fsqlite-vfs = { path = "../patches/fsqlite-vfs" }
# ===== [OHOS PORT END] =====

[target.'cfg(target_os = "linux")'.dependencies]
# logind's delay inhibitor lets the server save before host shutdown kills panes.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# UTF-16 SDDL input for interprocess security descriptors.
widestring = "1.2"
wmi = { version = "0.18.4", default-features = false }
# Native Notification Center delivery for unpackaged Windows installs.
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
