[package]
name = "util"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A collection of utility structs and functions used by Zed and GPUI"


[lints]
workspace = true

[lib]
path = "src/util.rs"
doctest = true

[features]
test-support = ["rand", "util_macros", "path/test-support", "dep:tempfile"]
# Embed `fs_embed!` assets at compile time even in debug builds.
debug-embed = ["rust-embed/debug-embed"]

[dependencies]
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
globset.workspace = true
itertools.workspace = true
rand = { workspace = true, optional = true }
regex = { workspace = true, features = ["unicode-bool", "unicode-gencat"] }
rust-embed.workspace = true
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_json_lenient.workspace = true
tempfile = { workspace = true, optional = true }
unicase.workspace = true
url.workspace = true
percent-encoding.workspace = true
util_macros = { workspace = true, optional = true }
gpui_util.workspace = true
path = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async_zip.workspace = true
futures-lite.workspace = true
futures.workspace = true
shlex.workspace = true
smol.workspace = true
async-fs.workspace = true
walkdir.workspace = true
dirs.workspace = true

[target.'cfg(any(unix, not(target_family = "wasm")))'.dependencies]
log.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc.workspace = true
nix = { workspace = true, features = ["resource", "user"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true
which.workspace = true

[target.'cfg(windows)'.dependencies]
which.workspace = true
windows = { workspace = true, features = ["Win32_System_JobObjects"] }

# ===== [OHOS PORT BEGIN] on-device command router =====
# The OHOS sandbox forbids `exec` of arbitrary binaries, so `src/command/ohos.rs`
# routes every spawn through the on-device daemon. It depends only on the
# self-contained `cmd-client` crate (which carries its own `ExecSpec` /
# `RemoteCommandExecutor` contract). Non-OHOS targets keep `smol::process`
# via `src/command.rs`.
[target.'cfg(target_env = "ohos")'.dependencies]
cmd-client = { path = "../gpui_ohos/depend/cmd-agent/cmd-client" }
# Tar extraction with the OHOS sandbox link fallback (see archive.rs).
async-tar.workspace = true
# Upstream only enables `which` for macOS and Windows; the OHOS resolver hook
# still needs it to answer PATH lookups through hicodeerd.
which.workspace = true
# ===== [OHOS PORT END] =====

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
util_macros.workspace = true
path = { workspace = true, features = ["test-support"] }
