[package]
name = "hicodeerd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "On-device command server for the HiCodeer host application (russh SSH, HarmonyOS)"

# Standalone crate: NOT a member of the top-level workspace. Declaring an empty
# [workspace] here stops cargo from searching upward into the repository workspace,
# so this crate resolves independently (same pattern as cmd-agentd).
[workspace]

[[bin]]
name = "hicodeerd"
path = "src/main.rs"

[dependencies]
# The agent server and TUI client, hosted in this process (see `run`). The
# crate is vendored at the repository root together with the libghostty-vt tree
# it builds against, so the daemon builds from a single checkout. It is renamed
# here so this daemon's own code does not carry the upstream name.
agent_server = { package = "hicodeer-agent", path = "../../../../../herdr" }
# Same russh configuration as the OpenEuler cmd-agent: ring backend (pure Rust,
# fast compile) instead of the default aws-lc-rs. Serves both the dynamic
# command SSH listener and the fixed-key management listener.
russh = { version = "0.55", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
libc = "0.2"
rand_core = "0.6"

[build-dependencies]
# `flock` for the shared management-key generation in build.rs.
libc = "0.2"

[patch.crates-io]
# The vendored agent server patches portable-pty; `[patch]` is only read from
# the top-level workspace manifest, so the same patch has to be restated here.
portable-pty = { path = "../../../../../herdr/vendor/portable-pty" }
# ===== [OHOS PORT BEGIN] =====
# `fsqlite` (reached through the agent-history SQLite connectors) builds an
# io_uring ring on Linux. On OpenHarmony `io_uring_register` (syscall 427) is
# not in the app seccomp allow-list and terminates the process with SIGSYS
# instead of failing the call, so the patched VFS skips the ring there and every
# file falls back to the blocking Unix implementation.
fsqlite-vfs = { path = "../../../../../patches/fsqlite-vfs" }
# ===== [OHOS PORT END] =====
