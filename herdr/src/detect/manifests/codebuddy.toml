id = "codebuddy"
version = "2026.10.23.1"
min_engine_version = 2
updated_at = "2026-10-23T00:00:00Z"
aliases = ["codebuddy-code", "codebuddy-cli"]

# Permission prompts: CodeBuddy renders "Do you want to proceed?" with
# numbered options and an "Esc to cancel" footer, like Claude Code.
[[rules]]
id = "permission_prompt_blocked"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(20)"
visible_blocker = true
regex = ['(?i)do\s+you\s+want\s+to\s+proceed\?']
any = [
  { contains = ["1. yes"] },
  { contains = ["2. yes"] },
]

[[rules]]
id = "connection_approval_blocked"
state = "blocked"
priority = 975
region = "whole_recent"
visible_blocker = true
contains = ["do you want to allow this connection?"]

[[rules]]
id = "waiting_permission_blocked"
state = "blocked"
priority = 970
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["waiting for permission"]

# Live turn: the footer renders "<glyph> <verb> … (<n>s · running <tool> · …)",
# for example "✶ 实现 … (460s · running TaskOutput · ctrl+t to show todos)".
# The elapsed seconds and the "running <tool>" clause exist only while a turn
# is in flight, so the line shape carries the state. The glyph set covers every
# frame CodeBuddy rotates through (✶ ✸ ✳ ✻ ✽ ✢ ·) plus the asterisk form.
[[rules]]
id = "live_turn_working"
state = "working"
priority = 900
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{2738}\x{273B}\x{273D}]\s+\S.*…\s+\(\d+[smh]\s*·']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
]

# Live turn, wrapped: a narrow pane splits that footer, and the redrawn first
# half can be gone by the time the screen is read, leaving only
# " (693s · running Bash · …)". The elapsed-seconds-plus-tool shape still
# carries the state, so accept it on its own; the region keeps it in the footer.
[[rules]]
id = "live_turn_footer_working"
state = "working"
priority = 895
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*\(\d+[smh]\s*·\s*running\s+\S']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
]

# Live turn: the footer renders "(12s • esc to interrupt)" while the agent runs.
[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 900
region = "bottom_non_empty_lines(20)"
visible_working = true
regex = ['(?i)esc\s+to\s+interrupt']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["waiting for permission"] },
]
