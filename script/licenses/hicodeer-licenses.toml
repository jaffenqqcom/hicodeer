# ==================== franken stack (FAD and its dependencies) ====================
# These crates declare the license only through `license-file = "LICENSE"`, and
# the file starts with "MIT License (with OpenAI/Anthropic Rider)", which is not
# a text cargo-about can match. The clarification below supplies the expression
# (and the checksummed file, which cargo-about requires for a valid
# clarification) so the requirement resolves. The text itself is emitted by the
# CUSTOM LICENSE TERMS section (generate-rider-licenses.py): cargo-about drops
# the group from its own output because it cannot classify the license text.

[fsqlite.clarify]
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
[[fsqlite.clarify.files]]
path = 'LICENSE'
checksum = '32a82e0a5754e72e51fae44b65a936c831c07376f21c90f5fb9e76897fcc3509'

